<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몬스터헌터 아웃랜더스 · SSR 자선 自选</title>
<style>
  :root{--bg:#0e1319;--card:#18202a;--line:#27313d;--txt:#e6ecf3;--muted:#8595a6;--gold:#f0b429}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{width:min(1080px,100% - 24px);margin-inline:auto}
  header{padding:16px 0 12px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#141c25,#0e1319)}
  h1{margin:0;font-size:18px;letter-spacing:-.01em;font-weight:800}
  h1 b{color:var(--gold)}
  .sub{font-size:11px;color:var(--muted);margin-top:3px}
  .stats{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--muted)}
  .stats b{color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums;margin-right:3px}

  /* 角色筛选（必需功能③）*/
  .sect{padding:12px 0 4px}
  .searchrow{display:flex;gap:7px;margin-bottom:10px}
  .searchrow input{flex:1;padding:8px 12px;border-radius:9px;border:1px solid var(--line);
    background:#131b24;color:var(--txt);font-size:13px;outline:none;font-family:inherit}
  .searchrow input:focus{border-color:var(--gold)}
  .searchrow input::placeholder{color:#5d6b7a}
  .qbtn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);
    background:#1b242e;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit}
  .qbtn:hover{border-color:var(--gold);color:var(--gold)}
  .match{font-size:11px;color:var(--gold);margin-left:auto}
  .stitle{font-size:11px;color:var(--muted);margin-bottom:6px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:4px 10px 4px 4px;
    border-radius:999px;border:1px solid var(--line);background:var(--card);
    font-size:12px;white-space:nowrap;cursor:pointer;color:var(--txt);transition:.12s}
  .chip img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#0b1016}
  .chip .ph{width:24px;height:24px;border-radius:50%;background:#0b1016;
    display:inline-block}
  .chip .n{font-weight:700}
  .chip .c{font-size:10px;color:var(--muted)}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:#2b2412;border-color:var(--gold);color:var(--gold)}
  .chip.on .c{color:var(--gold)}
  .chip.zero{opacity:1}   /* 2026-11-12：用户要求全部亮起，不再灰 */
  .clear{padding:4px 10px;font-size:12px;border-radius:999px;border:1px solid #a4433f;
    background:#331a1c;color:#ffb0ab;cursor:pointer;font-family:inherit}
  .sortrow{display:flex;gap:6px;align-items:center;padding-top:6px;flex-wrap:wrap}
  .sortrow span{font-size:11px;color:var(--muted)}
  .sortrow button{padding:3px 11px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);font-size:11.5px;cursor:pointer;font-family:inherit}
  .sortrow button.on{background:#2b2412;border-color:var(--gold);color:var(--gold)}

  /* 账号卡（必需功能①②）*/
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
    gap:12px;padding:12px 0 36px}
  .acct{background:var(--card);border:1px solid var(--line);border-radius:13px;
    overflow:hidden;transition:.12s;position:relative;cursor:pointer}
  .acct:hover{border-color:var(--gold)}
  .acct.sold{opacity:.45;filter:grayscale(.75)}
  .ahead{display:flex;justify-content:space-between;align-items:center;
    padding:9px 11px;border-bottom:1px solid var(--line)}
  .anum{font-size:14px;font-weight:800;letter-spacing:.02em}
  .copy{font-size:10px;color:var(--muted);border:1px solid var(--line);
    border-radius:5px;padding:1px 6px;margin-left:7px;background:#111923}
  .cnt{font-size:11px;color:var(--gold);font-weight:700}
  .chars{display:flex;flex-wrap:wrap;gap:7px;padding:11px}
  .ch{width:68px;text-align:center}
  .ch .ph{width:68px;height:60px;border-radius:8px;overflow:hidden;background:#0b1016}
  .ch .ph img{width:100%;height:100%;object-fit:cover}
  .ch .nm{font-size:10.5px;font-weight:700;margin-top:3px;line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ribbon{position:absolute;top:0;right:0;background:#c4463f;color:#fff;font-size:9.5px;
    font-weight:800;padding:2px 9px;border-bottom-left-radius:9px;z-index:2}
  .empty{text-align:center;padding:56px 16px;color:var(--muted);grid-column:1/-1}
  .empty h2{color:var(--txt);font-size:16px;margin:0 0 6px}
  footer{padding:12px 0 26px;color:var(--muted);font-size:10.5px;text-align:center}

  /* 弹窗 */
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;
    justify-content:center;padding:14px;background:rgba(5,8,11,.84)}
  .modal.show{display:flex}
  .mbox{background:#161e27;border:1px solid var(--line);border-radius:15px;
    max-width:min(520px,96vw);max-height:90vh;overflow:auto;padding:14px;width:100%}
  .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
  .mt{font-size:15px;font-weight:800;color:var(--gold)}
  .mx{border:0;background:#232d38;color:var(--txt);width:30px;height:30px;
    border-radius:50%;cursor:pointer;font-size:14px}
  .mgrid{display:flex;flex-wrap:wrap;gap:9px}
  .mg{width:80px;text-align:center}
  .mg img{width:80px;height:80px;border-radius:9px;background:#0b1016;object-fit:cover}
  .mg .n{font-size:11.5px;font-weight:700;margin-top:3px}
  .mg .k{font-size:9.5px;color:var(--muted)}
  @media(max-width:560px){
    .grid{grid-template-columns:1fr}
    .ch{width:60px}.ch .ph{width:60px;height:54px}
  }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>MHO <b>SSR</b> 자선 自选</h1>
  <div class="sub">몬스터헌터 아웃랜더스 · 脚本自动上传</div>
  <div class="stats">
    <span><b id="s-acc">0</b>계정 账号</span>
    <span><b id="s-ssr">0</b>SSR</span>
    <span><b id="s-sold">0</b>판매완료 已售</span>
    <span><b id="s-time">—</b>업데이트</span>
  </div>
</div></header>

<div class="wrap">
  <div class="sect">
    <div class="searchrow">
      <input id="q" type="search" placeholder="搜索账号编号 / 角色名 …">
      <button id="qclear" class="qbtn">清除</button>
    </div>
    <div class="stitle">캐릭터로 찾기 · 点角色筛选（可多选，需同时拥有）</div>
    <div class="chips" id="chips"></div>
    <div class="sortrow">
      <span>정렬 排序</span>
      <button data-sort="num" class="on">编号</button>
      <button data-sort="ssr">SSR数</button>
      <button data-sort="new">最新</button>
      <span class="match" id="match"></span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<footer>数据由脚本实时上传 · 每 60 秒刷新</footer>

<div class="modal" id="modal" onclick="if(event.target===this)closeM()">
  <div class="mbox">
    <div class="mh"><div class="mt" id="mt">#</div>
      <button class="mx" onclick="closeM()">✕</button></div>
    <div class="mgrid" id="mg"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
var DATA = window.SSR_DATA || {accounts: [], catalog: []};
var picked = new Set();
var sortBy = 'num';

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* 角色目录 + 实际出现过的角色合并 */
function allChars(){
  var m = {}, list = [];
  (DATA.catalog||[]).forEach(function(c){
    if (!m[c.name]) { m[c.name] = {name:c.name, avatar:c.avatar||'', count:0}; list.push(m[c.name]); }
  });
  DATA.accounts.forEach(function(a){
    (a.chars||[]).forEach(function(c){
      if (!m[c.name]) { m[c.name] = {name:c.name, avatar:c.avatar||'', count:0}; list.push(m[c.name]); }
      if (!m[c.name].avatar && c.avatar) m[c.name].avatar = c.avatar;
      if (!c.sold) m[c.name].count++;
    });
  });
  list.sort(function(x,y){
    if (y.count !== x.count) return y.count - x.count;
    return String(x.name).localeCompare(String(y.name), 'zh');
  });
  return list;
}

function buildChips(){
  var list = allChars();
  var html = list.map(function(c){
    var on = picked.has(c.name) ? ' on' : '';
    var av = c.avatar ? '<img src="'+esc(c.avatar)+'">' : '<span class="ph"></span>';
    return '<button class="chip'+on+'" data-n="'+esc(c.name)+'">'+
      av+'<span class="n">'+esc(c.name)+'</span></button>';
  }).join('');
  if (picked.size) html += '<button class="clear">清除 '+picked.size+'</button>';
  var box = document.getElementById('chips');
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll('.chip'), function(b){
    b.onclick = function(){
      var n = b.getAttribute('data-n');
      if (picked.has(n)) picked.delete(n); else picked.add(n);
      buildChips(); render();
    };
  });
  var clr = box.querySelector('.clear');
  if (clr) clr.onclick = function(){ picked.clear(); buildChips(); render(); };
}

var q = '';

function render(){
  var kw = q.trim().toLowerCase();
  var arr = DATA.accounts.filter(function(a){
    // ① 角色筛选：必须同时拥有所有选中角色
    if (picked.size) {
      var names = (a.chars||[]).map(function(c){ return c.name; });
      var has = true;
      picked.forEach(function(p){ if (names.indexOf(p) < 0) has = false; });
      if (!has) return false;
    }
    // ② 关键词：账号编号 或 任一角色名
    if (kw) {
      var hit = String(a.account||'').toLowerCase().indexOf(kw) >= 0;
      if (!hit) {
        hit = (a.chars||[]).some(function(c){
          return String(c.name||'').toLowerCase().indexOf(kw) >= 0;
        });
      }
      if (!hit) return false;
    }
    return true;
  });

  if (sortBy === 'ssr') {
    arr.sort(function(x,y){
      return y.chars.filter(function(c){return !c.sold;}).length -
             x.chars.filter(function(c){return !c.sold;}).length;
    });
  } else if (sortBy === 'new') {
    arr.sort(function(x,y){ return String(y.time||'').localeCompare(String(x.time||'')); });
  } else {
    arr.sort(function(x,y){ return String(x.account||'').localeCompare(String(y.account||'')); });
  }

  var live = 0, sold = 0;
  DATA.accounts.forEach(function(a){
    (a.chars||[]).forEach(function(c){ c.sold ? sold++ : live++; });
  });
  document.getElementById('s-acc').textContent = DATA.accounts.length;
  document.getElementById('s-ssr').textContent = live;
  document.getElementById('s-sold').textContent = sold;
  document.getElementById('s-time').textContent = (DATA.updated||'—').slice(5,16);

  // 匹配数量提示（用户要的"点角色后弹出拥有几个"）
  var mEl = document.getElementById('match');
  if (mEl) {
    if (picked.size || kw) {
      var who = [];
      picked.forEach(function(p){ who.push(p); });
      var label = who.length ? who.join(' + ') : '"' + q.trim() + '"';
      mEl.textContent = label + ' ：拥有 ' + arr.length + ' 个账号';
    } else {
      mEl.textContent = '';
    }
  }

  if (!arr.length) {
    var msg;
    if (picked.size || kw) {
      msg = '조건에 맞는 계정이 없어요<br>没有符合条件的账号';
    } else {
      msg = '아직 없어요<br>还没有数据';
    }
    document.getElementById('grid').innerHTML =
      '<div class="empty"><h2>' + msg + '</h2></div>';
    return;
  }

  document.getElementById('grid').innerHTML = arr.map(function(a){
    var allSold = a.chars.length > 0 && a.chars.every(function(c){ return c.sold; });
    var liveN = a.chars.filter(function(c){ return !c.sold; }).length;
    var inner = a.chars.map(function(c){
      var img = c.avatar ? '<img src="'+esc(c.avatar)+'">' : '';
      return '<div class="ch"><div class="ph">'+img+'</div>' +
             '<div class="nm">'+esc(c.name)+'</div></div>';
    }).join('');
    return '<div class="acct'+(allSold?' sold':'')+'" data-acc="'+esc(a.account)+'">'+
      (allSold ? '<div class="ribbon">판매완료 已售</div>' : '') +
      '<div class="ahead"><div class="anum">#'+esc(a.account)+
      '<span class="copy" data-copy="'+esc(a.account)+'">복사 复制</span></div>' +
      '<div class="cnt">SSR × '+liveN+'</div></div>' +
      '<div class="chars">'+inner+'</div></div>';
  }).join('');

  // 点卡弹窗 + 点复制按钮复制编号
  Array.prototype.forEach.call(
    document.querySelectorAll('.acct'), function(el){
      el.onclick = function(ev){
        var cp = ev.target.closest ? ev.target.closest('.copy') : null;
        if (cp) {
          var txt = cp.getAttribute('data-copy');
          try {
            navigator.clipboard.writeText(txt);
            cp.textContent = '已复制';
            setTimeout(function(){ cp.textContent = '복사 复制'; }, 1200);
          } catch(e) { alert('编号：' + txt); }
          return;
        }
        openM(el.getAttribute('data-acc'));
      };
  });
}

function openM(acc){
  var a = null;
  DATA.accounts.forEach(function(x){ if (x.account === acc) a = x; });
  if (!a) return;
  document.getElementById('mt').textContent = '#' + acc +
    (a.time ? '  ·  ' + a.time : '') + '  ·  SSR × ' +
    a.chars.filter(function(c){ return !c.sold; }).length;
  document.getElementById('mg').innerHTML = a.chars.map(function(c){
    var img = c.avatar ? '<img src="'+esc(c.avatar)+'">' : '';
    return '<div class="mg">'+img+'<div class="n">'+esc(c.name)+'</div>' +
           '<div class="k">'+(c.sold ? '已售' : 'SSR')+'</div></div>';
  }).join('');
  document.getElementById('modal').classList.add('show');
}
function closeM(){ document.getElementById('modal').classList.remove('show'); }

Array.prototype.forEach.call(
  document.querySelectorAll('.sortrow button'), function(b){
    b.onclick = function(){
      Array.prototype.forEach.call(
        document.querySelectorAll('.sortrow button'),
        function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      sortBy = b.getAttribute('data-sort');
      render();
    };
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeM();
});

// 搜索框：边输边筛（输入即刷新，不用点按钮）
var qEl = document.getElementById('q');
if (qEl) {
  qEl.oninput = function(){ q = qEl.value; render(); };
}
var qc = document.getElementById('qclear');
if (qc) {
  qc.onclick = function(){
    q = ''; if (qEl) qEl.value = '';
    picked.clear();
    buildChips(); render();
  };
}

buildChips(); render();
setInterval(function(){ location.reload(); }, 60000);
</script>
</body>
</html>
