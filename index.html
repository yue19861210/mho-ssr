<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몬스터헌터 아웃랜더스 · SSR 자선 自选</title>
<style>
  :root{--bg:#0e1319;--card:#18202a;--line:#27313d;--txt:#e6ecf3;--muted:#8595a6;--gold:#f0b429}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{width:min(1080px,100% - 24px);margin-inline:auto}
  header{padding:16px 0 12px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#141c25,#0e1319)}
  h1{margin:0;font-size:18px;letter-spacing:-.01em;font-weight:800}
  h1 b{color:var(--gold)}
  .sub{font-size:11px;color:var(--muted);margin-top:3px}
  .stats{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--muted)}
  .stats b{color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums;margin-right:3px}

  /* 角色筛选（必需功能③）*/
  .sect{padding:12px 0 4px}
  .searchrow{display:flex;gap:7px;margin-bottom:10px}
  .searchrow input{flex:1;padding:8px 12px;border-radius:9px;border:1px solid var(--line);
    background:#131b24;color:var(--txt);font-size:13px;outline:none;font-family:inherit}
  .searchrow input:focus{border-color:var(--gold)}
  .searchrow input::placeholder{color:#5d6b7a}
  .qbtn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);
    background:#1b242e;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit}
  .qbtn:hover{border-color:var(--gold);color:var(--gold)}
  .match{font-size:11px;color:var(--gold);margin-left:auto}
  .stitle{font-size:11px;color:var(--muted);margin:0 0 6px}
  /* ★ 2026-11-13 多游戏切换（≥2 个游戏时才显示）*/
  /* ★ 2026-11-13 游戏大图标入口（≥2 游戏才显示）*/
  .gentry{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;padding:6px 0 14px}
  .gcard{display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:18px 10px 14px;border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(160deg,#1b2532,#141b24);cursor:pointer;
    transition:.15s;font-family:inherit;color:var(--txt)}
  .gcard:hover{border-color:var(--gold);transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(240,180,41,.12)}
  .gcard .ic{width:72px;height:72px;border-radius:18px;display:flex;
    align-items:center;justify-content:center;font-size:36px;
    background:radial-gradient(circle at 30% 25%,#2f3d4e,#18202a);
    border:1px solid #2c3a48}
  .gcard .gname{font-size:13px;font-weight:800;text-align:center;
    line-height:1.35}
  .gcard .gmeta{font-size:10.5px;color:var(--muted)}
  /* 右上角"返回游戏列表" */
  .backbtn{display:none;margin-left:auto;padding:5px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    font-size:11.5px;cursor:pointer;font-family:inherit}
  .backbtn:hover{border-color:var(--gold);color:var(--gold)}
  /* ★ 清除按钮（stitle 行右侧，搜索和角色图片中间）*/
  .stitle{display:flex;align-items:center;gap:8px}
  .chipclear{display:none;padding:3px 11px;font-size:11.5px;border-radius:999px;
    border:1px solid #a4433f;background:#2a1615;color:#f08a80;cursor:pointer;
    font-family:inherit;font-weight:700;margin-left:auto;white-space:nowrap}
  .chipclear:hover{background:#3a1d1b;color:#ff9b93}
  .gbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 2px}
  .gbar button{padding:5px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);font-size:12px;cursor:pointer;
    font-family:inherit;font-weight:700}
  .gbar button:hover{border-color:var(--gold);color:var(--gold)}
  .gbar button.on{background:#2b2412;border-color:var(--gold);color:var(--gold)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;
    scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  /* ★ 2026-11-13：角色卡改为【大图标】—— 64px 方形头像 + 下方名字 */
  .chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
    gap:3px;padding:4px 4px 5px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);
    font-size:11px;white-space:nowrap;cursor:pointer;color:var(--txt);
    transition:.12s;position:relative;width:72px}
  .chip img{width:64px;height:64px;border-radius:8px;object-fit:cover;
    background:#0b1016;display:block}
  .chip .ph{width:64px;height:64px;border-radius:8px;background:#0b1016;
    display:flex;align-items:center;justify-content:center;
    color:#3a4654;font-size:22px}
  .chip .n{font-weight:700;font-size:10.5px;max-width:68px;
    overflow:hidden;text-overflow:ellipsis;text-align:center;line-height:1.2}
  .chip .c{font-size:10px;color:var(--muted)}
  .chip .qty{position:absolute;top:1px;right:1px;font-size:10px;
    font-weight:900;color:#0e1319;background:var(--gold);
    border-radius:999px;padding:0 5px;line-height:15px;min-width:16px;
    text-align:center;box-shadow:0 0 0 2px var(--card)}
  .chip .qty{position:absolute;top:2px;right:2px;font-size:10px;
    font-weight:900;color:#0e1319;background:var(--gold);
    border-radius:999px;padding:0 5px;line-height:15px;min-width:16px;
    text-align:center;box-shadow:0 0 0 2px var(--card)}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:#2b2412;border-color:var(--gold);color:var(--gold)}
  .chip.on .c{color:var(--gold)}
  .chip.zero{opacity:1}   /* 2026-11-12：用户要求全部亮起，不再灰 */
  .clear{padding:4px 10px;font-size:12px;border-radius:999px;border:1px solid #a4433f;
    background:#331a1c;color:#ffb0ab;cursor:pointer;font-family:inherit}
  .sortrow{display:flex;gap:6px;align-items:center;padding-top:6px;flex-wrap:wrap}
  .sortrow span{font-size:11px;color:var(--muted)}
  .sortrow button{padding:3px 11px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);font-size:11.5px;cursor:pointer;font-family:inherit}
  .sortrow button.on{background:#2b2412;border-color:var(--gold);color:var(--gold)}

  /* 账号卡（必需功能①②）*/
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
    gap:12px;padding:12px 0 36px}
  .acct{background:var(--card);border:1px solid var(--line);border-radius:13px;
    overflow:hidden;transition:.12s;position:relative;cursor:pointer}
  .acct:hover{border-color:var(--gold)}
  .acct.sold{opacity:.45;filter:grayscale(.75)}
  .ahead{display:flex;justify-content:space-between;align-items:center;
    padding:9px 11px;border-bottom:1px solid var(--line)}
  .anum{font-size:14px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:4px}
  .mtag{font-size:10px;font-weight:800;color:#0e1319;background:var(--gold);border-radius:4px;padding:1px 6px;letter-spacing:0}
  .copy{font-size:10px;color:var(--muted);border:1px solid var(--line);
    border-radius:5px;padding:1px 6px;margin-left:7px;background:#111923}
  .cnt{font-size:11px;color:var(--gold);font-weight:700;text-align:right;line-height:1.35}
  .atime{display:block;font-size:9.5px;color:var(--muted);font-weight:400}
  .chars{display:flex;flex-wrap:wrap;gap:7px;padding:11px}
  .ch{width:68px;text-align:center}
  .ch .ph{width:68px;height:60px;border-radius:8px;overflow:hidden;background:#0b1016}
  .ch .ph img{width:100%;height:100%;object-fit:cover}
  .ch .nm{font-size:10.5px;font-weight:700;margin-top:3px;line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ribbon{position:absolute;top:0;right:0;background:#c4463f;color:#fff;font-size:9.5px;
    font-weight:800;padding:2px 9px;border-bottom-left-radius:9px;z-index:2}
  .empty{text-align:center;padding:56px 16px;color:var(--muted);grid-column:1/-1}
  .empty h2{color:var(--txt);font-size:16px;margin:0 0 6px}
  footer{padding:12px 0 26px;color:var(--muted);font-size:10.5px;text-align:center}
  /* 分页条 */
  .pager{display:flex;align-items:center;justify-content:center;gap:7px;
    padding:10px 0 26px;flex-wrap:wrap}
  .pager button{padding:4px 12px;border-radius:7px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);font-size:12px;
    cursor:pointer;font-family:inherit;min-width:34px}
  .pager button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
  .pager button.on{background:#2b2412;border-color:var(--gold);color:var(--gold);
    font-weight:800}
  .pager button:disabled{opacity:.35;cursor:default}
  .pager .info{font-size:11px;color:var(--muted);margin-left:8px}
  .pager select{padding:4px 8px;border-radius:7px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:11.5px;font-family:inherit}

  /* 弹窗 */
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;
    justify-content:center;padding:14px;background:rgba(5,8,11,.84)}
  .modal.show{display:flex}
  .mbox{background:#161e27;border:1px solid var(--line);border-radius:15px;
    max-width:min(520px,96vw);max-height:90vh;overflow:auto;padding:14px;width:100%}
  .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
  .mt{font-size:15px;font-weight:800;color:var(--gold)}
  .mx{border:0;background:#232d38;color:var(--txt);width:30px;height:30px;
    border-radius:50%;cursor:pointer;font-size:14px}
  .mgrid{display:flex;flex-wrap:wrap;gap:9px}
  .mg{width:80px;text-align:center}
  .mg img{width:80px;height:80px;border-radius:9px;background:#0b1016;object-fit:cover}
  .mg .n{font-size:11.5px;font-weight:700;margin-top:3px}
  .mg .k{font-size:9.5px;color:var(--muted)}
  @media(max-width:560px){
    .grid{grid-template-columns:1fr}
    .ch{width:60px}.ch .ph{width:60px;height:54px}
  }
</style>
</head>
<body>
<header><div class="wrap">
  <h1 style="display:flex;align-items:center;gap:10px">
    <span id="htitle">MHO <b>SSR</b> 자선 自选</span>
    <button class="backbtn" id="backbtn" onclick="exitGame()">← 게임목록 游戏列表</button>
  </h1>
  <div class="sub" id="hsub">몬스터헌터 아웃랜더스 · 脚本自动上传</div>
  <div class="stats">
    <span><b id="s-acc">0</b>계정 账号</span>
    <span><b id="s-ssr">0</b>SSR</span>
    <span><b id="s-sold">0</b>판매완료 已售</span>
    <span><b id="s-mach">0</b>대 기기 台机器</span>
    <span><b id="s-time">—</b>업데이트</span>
  </div>
</div></header>

<div class="wrap">
  <div class="sect">
    <!-- ★ 游戏大图标入口（只有 ≥2 个游戏时才显示）-->
    <div class="gentry" id="gentry" style="display:none"></div>
    <div class="gbar" id="gbar" style="display:none"></div>
  </div>
  <div class="sect" id="gameview">
    <div class="searchrow">
      <input id="q" type="search" placeholder="搜索账号编号 / 角色名 …">
      <button id="qclear" class="qbtn">清除</button>
    </div>
    <div class="stitle">
      <span>캐릭터로 찾기 · 点角色筛选（可多选，需同时拥有）</span>
      <button class="chipclear" id="chipclear">✕ 清除</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="sortrow">
      <span>정렬 排序</span>
      <button data-sort="num" class="on">编号</button>
      <button data-sort="ssr">SSR数</button>
      <button data-sort="new">最新</button>
      <span class="match" id="match"></span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
</div>
<footer>数据由脚本实时上传 · 每 60 秒刷新</footer>

<div class="modal" id="modal" onclick="if(event.target===this)closeM()">
  <div class="mbox">
    <div class="mh"><div class="mt" id="mt">#</div>
      <button class="mx" onclick="closeM()">✕</button></div>
    <div class="mgrid" id="mg"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
var DATA = window.SSR_DATA || {accounts: [], catalog: []};
// ★ 2026-11-12：picked 从 Set 改成 Map(角色名 → 要求张数)
//   点一下=1张，再点=2张…最多10张，超过回到0（对齐参考站交互）
var picked = new Map();
var MAXQ = 10;
// ★ 2026-11-12 新增分页（对齐参考站：每页 10/20/50/全部）
var pageNo = 1;
var pageSize = 10;   // ★ 2026-11-13 用户要求默认 10 条
// ★ 2026-11-13 多游戏：当前选中的游戏（空 = 全部）
var curGame = '';
var sortBy = 'num';

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* 角色目录 + 实际出现过的角色合并 */
function allChars(){
  var m = {}, list = [];
  curCatalog().forEach(function(c){
    if (!m[c.name]) { m[c.name] = {name:c.name, avatar:c.avatar||'', count:0}; list.push(m[c.name]); }
  });
  DATA.accounts.forEach(function(a){
    (a.chars||[]).forEach(function(c){
      if (!m[c.name]) { m[c.name] = {name:c.name, avatar:c.avatar||'', count:0}; list.push(m[c.name]); }
      if (!m[c.name].avatar && c.avatar) m[c.name].avatar = c.avatar;
      if (!c.sold) m[c.name].count++;
    });
  });
  list.sort(function(x,y){
    if (y.count !== x.count) return y.count - x.count;
    return String(x.name).localeCompare(String(y.name), 'zh');
  });
  return list;
}

/* ★ 2026-11-13 多游戏：从数据里推断游戏清单（兼容老数据）*/
function gameList(){
  // ① 新数据结构：DATA.games
  if (Array.isArray(DATA.games) && DATA.games.length) return DATA.games;
  // ② 老数据：从 accounts 的 game 字段推断
  var m = {};
  (DATA.accounts || []).forEach(function(a){
    var g = a.game || 'default';
    if (!m[g]) m[g] = {id: g, name: g === 'mhtc' ? '몬스터헌터 아웃랜더스' : g,
                       catalog: []};
  });
  return Object.keys(m).map(function(k){ return m[k]; });
}

/* 当前游戏对应的 catalog（角色头像库）*/
function curCatalog(){
  var gs = gameList();
  if (curGame) {
    for (var i = 0; i < gs.length; i++) {
      if (gs[i].id === curGame) return gs[i].catalog || [];
    }
    return [];
  }
  // 全部：合并所有游戏的 catalog
  var out = [];
  gs.forEach(function(g){ out = out.concat(g.catalog || []); });
  return out;
}

/* 每个游戏的图标（emoji，可换成官方 logo URL）*/
var GAME_ICONS = {
  'mhtc':    '🏹',
  'gf2':     '🔫',
  'chaoxi':  '⚓',
  'lqsn':    '🏀',
  'lvmeng':  '🌙',
  'nikke':   '💃',
  'default': '🎮'
};

function gameIcon(gid){
  return GAME_ICONS[String(gid || '').toLowerCase()] || GAME_ICONS['default'];
}

/* ★ 2026-11-13：渲染游戏大图标入口 / 切换栏
   · 1 个游戏   → 入口隐藏，直接进内容（和以前完全一样）
   · ≥2 游戏    → 显示「全部」+ 各游戏大图标卡片
*/
function buildGameBar(){
  var gs = gameList();
  var entry = document.getElementById('gentry');
  var bar = document.getElementById('gbar');
  var view = document.getElementById('gameview');
  var back = document.getElementById('backbtn');
  var hsub = document.getElementById('hsub');
  if (!entry || !view) return;

  // ---- 单游戏：入口全隐藏，内容常显 ----
  if (gs.length <= 1) {
    entry.style.display = 'none';
    if (bar) bar.style.display = 'none';
    view.style.display = '';
    if (back) back.style.display = 'none';
    if (hsub && gs.length === 1) {
      hsub.textContent = gs[0].name + ' · 脚本自动上传';
    }
    return;
  }

  // ---- 多游戏，且还没选游戏 → 显示大图标入口 ----
  if (!curGame) {
    entry.style.display = 'grid';
    if (bar) bar.style.display = 'none';
    view.style.display = 'none';
    if (back) back.style.display = 'none';
    if (hsub) hsub.textContent = '원하는 게임을 선택하세요 · 请选择游戏';

    var html = '';
    // 全部（汇总）
    var totAcc = (DATA.accounts || []).length;
    html += '<button class="gcard" data-g="">' +
              '<span class="ic">' + gameIcon('') + '</span>' +
              '<span class="gname">전체 全部游戏</span>' +
              '<span class="gmeta">' + totAcc + ' 개 계정</span>' +
            '</button>';
    gs.forEach(function(g){
      var n = 0;
      (DATA.accounts || []).forEach(function(a){
        if ((a.game || 'default') === g.id) n++;
      });
      html += '<button class="gcard" data-g="' + esc(g.id) + '">' +
                '<span class="ic">' + gameIcon(g.id) + '</span>' +
                '<span class="gname">' + esc(g.name) + '</span>' +
                '<span class="gmeta">' + n + ' 개 계정 · ' +
                  (g.catalog || []).length + ' 캐릭터</span>' +
              '</button>';
    });
    entry.innerHTML = html;
    Array.prototype.forEach.call(
      entry.querySelectorAll('.gcard'), function(b){
        b.onclick = function(){ enterGame(b.getAttribute('data-g') || ''); };
      });
    return;
  }

  // ---- 多游戏，已选游戏 → 显示内容 ----
  entry.style.display = 'none';
  if (bar) bar.style.display = 'none';
  view.style.display = '';
  if (back) back.style.display = 'inline-block';
  var gnow = null;
  gs.forEach(function(g){ if (g.id === curGame) gnow = g; });
  if (hsub) {
    hsub.textContent = gnow
      ? gnow.name + ' · 脚本自动上传'
      : '脚本自动上传';
  }
}

/* 进入某个游戏（gid 为空 = 全部游戏）*/
function enterGame(gid){
  curGame = gid || '';
  picked.clear();
  q = '';
  pageNo = 1;
  var qEl = document.getElementById('q');
  if (qEl) qEl.value = '';
  buildGameBar(); buildChips(); render();
  try { window.scrollTo({top:0, behavior:'smooth'}); } catch(e){}
}

/* 返回游戏列表*/
function exitGame(){
  curGame = '';
  picked.clear();
  pageNo = 1;
  buildGameBar(); buildChips(); render();
  try { window.scrollTo({top:0, behavior:'smooth'}); } catch(e){}
}

function buildChips(){
  var list = allChars();
  var html = list.map(function(c){
    var qn = picked.get(c.name) || 0;
    var on = qn > 0 ? ' on' : '';
    var av = c.avatar ? '<img src="'+esc(c.avatar)+'">' : '<span class="ph"></span>';
    var qbadge = qn > 1 ? '<span class="qty">×'+qn+'</span>' : '';
    return '<button class="chip'+on+'" data-n="'+esc(c.name)+'"'+
      ' title="点一下要求1张，再点要求2张…最多'+MAXQ+'张">'+
      av+'<span class="n">'+esc(c.name)+'</span>'+qbadge+'</button>';
  }).join('');
  // ★ 2026-11-13：清除按钮已移到 stitle 行（不再放最后）
  var box = document.getElementById('chips');
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll('.chip'), function(b){
    b.onclick = function(){
      var n = b.getAttribute('data-n');
      var cur = picked.get(n) || 0;
      var nxt = cur + 1;
      if (nxt > MAXQ) nxt = 0;              // 超过上限 → 取消
      if (nxt === 0) picked.delete(n); else picked.set(n, nxt);
      pageNo = 1;
      buildChips(); render();
    };
  });
  syncChipClear();
}

/* ★ 2026-11-13：同步 stitle 行的清除按钮状态 */
function syncChipClear(){
  var b = document.getElementById('chipclear');
  if (!b) return;
  if (picked.size) {
    var tot = 0; picked.forEach(function(v){ tot += v; });
    b.style.display = 'inline-block';
    b.textContent = '✕ 清除 ' + picked.size + '종/' + tot + '张';
  } else {
    b.style.display = 'none';
  }
}

var q = '';

function render(){
  var kw = q.trim().toLowerCase();
  var arr = DATA.accounts.filter(function(a){
    // ★ 多游戏：只显示当前选中游戏的账号
    if (curGame && (a.game || 'default') !== curGame) return false;
    // ① 角色筛选：必须同时拥有所有选中角色
    if (picked.size) {
      var ok = true;
      picked.forEach(function(needQty, pname){
        // 账号里该角色的总张数（兼容 count 字段，没有就当 1 张）
        var have = 0;
        (a.chars||[]).forEach(function(c){
          if (c.name === pname) have += (c.count || 1);
        });
        if (have < needQty) ok = false;     // 至少 N 张
      });
      if (!ok) return false;
    }
    // ② 关键词：账号编号 或 任一角色名
    if (kw) {
      var hit = String(a.account||'').toLowerCase().indexOf(kw) >= 0;
      if (!hit) {
        hit = (a.chars||[]).some(function(c){
          return String(c.name||'').toLowerCase().indexOf(kw) >= 0;
        });
      }
      if (!hit) return false;
    }
    return true;
  });

  if (sortBy === 'ssr') {
    arr.sort(function(x,y){
      return y.chars.filter(function(c){return !c.sold;}).length -
             x.chars.filter(function(c){return !c.sold;}).length;
    });
  } else if (sortBy === 'new') {
    arr.sort(function(x,y){ return String(y.time||'').localeCompare(String(x.time||'')); });
  } else {
    arr.sort(function(x,y){ return String(x.account||'').localeCompare(String(y.account||'')); });
  }

  var live = 0, sold = 0;
  DATA.accounts.forEach(function(a){
    (a.chars||[]).forEach(function(c){ c.sold ? sold++ : live++; });
  });
  var machSet = {};
  DATA.accounts.forEach(function(a){ if (a.machine) machSet[a.machine] = 1; });
  var machEl = document.getElementById('s-mach');
  if (machEl) machEl.textContent = Object.keys(machSet).length;
  document.getElementById('s-acc').textContent = DATA.accounts.length;
  document.getElementById('s-ssr').textContent = live;
  document.getElementById('s-sold').textContent = sold;
  document.getElementById('s-time').textContent = (DATA.updated||'—').slice(5,16);

  // 匹配数量提示（用户要的"点角色后弹出拥有几个"）
  var mEl = document.getElementById('match');
  if (mEl) {
    if (picked.size || kw) {
      var who = [];
      picked.forEach(function(qn, p){ who.push(qn > 1 ? p + '×' + qn : p); });
      var label = who.length ? who.join(' + ') : '"' + q.trim() + '"';
      mEl.textContent = label + ' ：拥有 ' + arr.length + ' 个账号';
    } else {
      mEl.textContent = '';
    }
  }

  if (!arr.length) {
    var msg;
    if (picked.size || kw) {
      msg = '조건에 맞는 계정이 없어요<br>没有符合条件的账号';
    } else {
      msg = '아직 없어요<br>还没有数据';
    }
    document.getElementById('grid').innerHTML =
      '<div class="empty"><h2>' + msg + '</h2></div>';
    var pg0 = document.getElementById('pager');
    if (pg0) pg0.innerHTML = '';
    return;
  }

  // ★ 分页：只渲染当前页
  var totalPages = (pageSize > 0)
    ? Math.max(1, Math.ceil(arr.length / pageSize)) : 1;
  if (pageNo > totalPages) pageNo = totalPages;
  if (pageNo < 1) pageNo = 1;
  var startIdx = (pageSize > 0) ? (pageNo - 1) * pageSize : 0;
  var pageArr = (pageSize > 0) ? arr.slice(startIdx, startIdx + pageSize) : arr;

  document.getElementById('grid').innerHTML = pageArr.map(function(a){
    var allSold = a.chars.length > 0 && a.chars.every(function(c){ return c.sold; });
    var liveN = a.chars.filter(function(c){ return !c.sold; }).length;
    var inner = a.chars.map(function(c){
      var img = c.avatar ? '<img src="'+esc(c.avatar)+'">' : '';
      return '<div class="ch"><div class="ph">'+img+'</div>' +
             '<div class="nm">'+esc(c.name)+'</div></div>';
    }).join('');
    return '<div class="acct'+(allSold?' sold':'')+'" data-acc="'+esc(a.account)+'">'+
      (allSold ? '<div class="ribbon">판매완료 已售</div>' : '') +
      '<div class="ahead"><div class="anum">'+
      (a.machine ? '<span class="mtag">'+esc(a.machine)+'</span>' : '')+
      '#'+esc(a.account)+
      '<span class="copy" data-copy="'+esc(a.account)+'">복사 复制</span></div>' +
      '<div class="cnt">SSR × '+liveN+
      (a.time ? '<span class="atime">'+esc(String(a.time).slice(5))+'</span>' : '')+
      '</div></div>' +
      '<div class="chars">'+inner+'</div></div>';
  }).join('');

  // ★ 渲染分页条
  renderPager(arr.length, totalPages);

  // 点卡弹窗 + 点复制按钮复制编号
  Array.prototype.forEach.call(
    document.querySelectorAll('.acct'), function(el){
      el.onclick = function(ev){
        var cp = ev.target.closest ? ev.target.closest('.copy') : null;
        if (cp) {
          var txt = cp.getAttribute('data-copy');
          try {
            navigator.clipboard.writeText(txt);
            cp.textContent = '已复制';
            setTimeout(function(){ cp.textContent = '복사 复制'; }, 1200);
          } catch(e) { alert('编号：' + txt); }
          return;
        }
        openM(el.getAttribute('data-acc'));
      };
  });
}

function renderPager(total, totalPages){
  var box = document.getElementById('pager');
  if (!box) return;
  if (pageSize <= 0 || totalPages <= 1) {
    // 单页也显示数量和每页选择器
    box.innerHTML =
      '<span class="info">共 ' + total + ' 个账号</span>' +
      pageSizeSelect() ;
    bindPageSize();
    return;
  }
  var html = '';
  html += '<button onclick="goPage(1)"' + (pageNo===1?' disabled':'') +
          '>«</button>';
  html += '<button onclick="goPage(' + (pageNo-1) + ')"' +
          (pageNo===1?' disabled':'') + '>‹</button>';
  // 页码：当前 ±2
  var from = Math.max(1, pageNo - 2), to = Math.min(totalPages, pageNo + 2);
  if (from > 1) html += '<button onclick="goPage(1)">1</button>';
  if (from > 2) html += '<span class="info">…</span>';
  for (var p = from; p <= to; p++) {
    html += '<button class="' + (p===pageNo?'on':'') +
            '" onclick="goPage(' + p + ')">' + p + '</button>';
  }
  if (to < totalPages - 1) html += '<span class="info">…</span>';
  if (to < totalPages) {
    html += '<button onclick="goPage(' + totalPages + ')">' +
            totalPages + '</button>';
  }
  html += '<button onclick="goPage(' + (pageNo+1) + ')"' +
          (pageNo===totalPages?' disabled':'') + '>›</button>';
  html += '<button onclick="goPage(' + totalPages + ')"' +
          (pageNo===totalPages?' disabled':'') + '>»</button>';
  html += '<span class="info">第 ' + pageNo + '/' + totalPages +
          ' 页 · 共 ' + total + ' 个</span>';
  html += pageSizeSelect();
  box.innerHTML = html;
  bindPageSize();
}

function pageSizeSelect(){
  var opts = [[10,'10/页'],[20,'20/页'],[50,'50/页'],[100,'100/页'],
              [0,'全部']];
  var h = '<select id="psel">';
  opts.forEach(function(o){
    h += '<option value="' + o[0] + '"' +
         (o[0] === pageSize ? ' selected' : '') + '>' + o[1] + '</option>';
  });
  return h + '</select>';
}

function bindPageSize(){
  var s = document.getElementById('psel');
  if (s) s.onchange = function(){
    pageSize = parseInt(s.value, 10) || 0;
    pageNo = 1;
    render();
  };
}

function goPage(p){
  pageNo = p;
  render();
  try {
    document.getElementById('grid').scrollIntoView(
      {behavior:'smooth', block:'start'});
  } catch(e) {}
}

function openM(acc){
  var a = null;
  DATA.accounts.forEach(function(x){ if (x.account === acc) a = x; });
  if (!a) return;
  document.getElementById('mt').textContent =
    (a.machine ? '[' + a.machine + '] ' : '') + '#' + acc +
    (a.time ? '  ·  ' + a.time : '') + '  ·  SSR × ' +
    a.chars.filter(function(c){ return !c.sold; }).length;
  document.getElementById('mg').innerHTML = a.chars.map(function(c){
    var img = c.avatar ? '<img src="'+esc(c.avatar)+'">' : '';
    return '<div class="mg">'+img+'<div class="n">'+esc(c.name)+'</div>' +
           '<div class="k">'+(c.sold ? '已售' : 'SSR')+'</div></div>';
  }).join('');
  document.getElementById('modal').classList.add('show');
}
function closeM(){ document.getElementById('modal').classList.remove('show'); }

Array.prototype.forEach.call(
  document.querySelectorAll('.sortrow button'), function(b){
    b.onclick = function(){
      Array.prototype.forEach.call(
        document.querySelectorAll('.sortrow button'),
        function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      sortBy = b.getAttribute('data-sort');
      pageNo = 1;
      render();
    };
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeM();
});

// 搜索框：边输边筛（输入即刷新，不用点按钮）
var qEl = document.getElementById('q');
if (qEl) {
  qEl.oninput = function(){ q = qEl.value; pageNo = 1; render(); };
}
// ★ 2026-11-13：stitle 行（搜索与角色图片之间）的角色清除按钮
var cc = document.getElementById('chipclear');
if (cc) {
  cc.onclick = function(){
    picked.clear(); buildChips(); render();
  };
}

var qc = document.getElementById('qclear');
if (qc) {
  qc.onclick = function(){
    q = ''; if (qEl) qEl.value = '';
    picked.clear();
    buildChips(); render();
  };
}

// ★ 启动：先决定显示游戏入口还是内容区，再渲染
buildGameBar();
buildChips();
render();
setInterval(function(){ location.reload(); }, 60000);
</script>
